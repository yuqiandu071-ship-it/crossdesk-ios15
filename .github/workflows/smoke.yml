name: smoke

on:
  workflow_dispatch:
  push:
    branches: [ ios15 ]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-13, macos-14, macos-15, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - run: |
          echo "runner=${{ matrix.os }}"
          uname -m
          sw_vers
          xcodebuild -version
