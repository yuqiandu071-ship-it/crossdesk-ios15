name: build-ios15

on:
  push:
    branches: [ios15]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS15 unsigned IPA
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CONFIGURATION: Release
      PLATFORM_NAME: iphoneos
      CURRENT_ARCH: arm64
      CROSSDESK_NATIVE_VERBOSE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Guard ios15 tree
        shell: bash
        run: |
          set -euo pipefail
          PBX=apps/ios/CrossDeskMobile.xcodeproj/project.pbxproj
          test "$(grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' "$PBX")" = "4"
          test "$(grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;' "$PBX" || true)" = "0"
          test "$(grep -rc 'NavigationStack' apps/ios/CrossDeskMobile/*.swift | awk -F: '{s+=$2} END {print s+0}')" = "0"
          test "$(grep -c -- '--target_minver=16.0' apps/ios/scripts/build_minirtc_ios.sh || true)" = "0"
          echo "guard: pbxproj 15.0 x4, no NavigationStack, minirtc target 15.0"

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install python build tools
        shell: bash
        run: |
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Install xmake 3.1.1
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"
          actions-cache-folder: ${{ runner.temp }}/xmake-toolchain

      - name: Toolchain info
        shell: bash
        run: |
          xmake --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build native MinRTC archives
        timeout-minutes: 90
        shell: bash
        env:
          CROSSDESK_TARGET_MINVER: "16.0"
        run: |
          set -o pipefail
          git config --global url."https://github.com/videolan/dav1d".insteadOf "https://code.videolan.org/videolan/dav1d"
          mkdir -p "${RUNNER_TEMP}/pbin"
          ln -sf /usr/bin/perl "${RUNNER_TEMP}/pbin/perl"
          export PATH="${RUNNER_TEMP}/pbin:${PATH}"
          perl -v | head -3
          apps/ios/scripts/build_minirtc_ios.sh 2>&1 | tee "${RUNNER_TEMP}/native-build.log"
          ls -l apps/ios/Vendor/iphoneos/Release/libCrossDeskMiniRTC.a

      - name: Build CrossDeskMobile
        timeout-minutes: 40
        shell: bash
        env:
          CROSSDESK_SKIP_NATIVE_BUILD: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/ios/CrossDeskMobile.xcodeproj \
            -scheme CrossDeskMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${RUNNER_TEMP}/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "${RUNNER_TEMP}/app-build.log"

      - name: Verify and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="${RUNNER_TEMP}/dd/Build/Products/Release-iphoneos/CrossDeskMobile.app"
          EXE="${APP}/CrossDeskMobile"
          test -x "${EXE}"
          xcrun vtool -show-build "${EXE}" | tee "${RUNNER_TEMP}/vtool.txt"
          grep -q 'minos 15.0' "${RUNNER_TEMP}/vtool.txt"
          MINOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "${APP}/Info.plist")"
          echo "Info.plist MinimumOSVersion=${MINOS}"
          test "${MINOS}" = "15.0"
          rm -rf "${RUNNER_TEMP}/Payload"
          mkdir -p "${RUNNER_TEMP}/Payload"
          cp -R "${APP}" "${RUNNER_TEMP}/Payload/"
          xattr -cr "${RUNNER_TEMP}/Payload" || true
          ( cd "${RUNNER_TEMP}" && zip -qry "${GITHUB_WORKSPACE}/CrossDeskMobile-iOS15-unsigned.ipa" Payload )
          shasum -a 256 "${GITHUB_WORKSPACE}/CrossDeskMobile-iOS15-unsigned.ipa" | tee "${RUNNER_TEMP}/ipa.sha256"
          ls -l "${GITHUB_WORKSPACE}/CrossDeskMobile-iOS15-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrossDeskMobile-iOS15-unsigned
          path: CrossDeskMobile-iOS15-unsigned.ipa
          if-no-files-found: error

      - name: Collect diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          cp "${RUNNER_TEMP}/native-build.log" diagnostics/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/app-build.log" diagnostics/ 2>/dev/null || true
          find apps/ios/.xmake "$HOME/Library/Caches/xmake" "$HOME/.xmake" -name 'install.txt' -path '*failed*' 2>/dev/null \
            | while IFS= read -r f; do
                safe="$(echo "$f" | sed 's#[^/]*/\.xmake/##; s#.*/cache/packages/##; s#/#_#g')"
                cp "$f" "diagnostics/$safe" 2>/dev/null || true
              done
          find apps/ios/.xmake "$HOME/Library/Caches/xmake" -name 'meson-log.txt' 2>/dev/null \
            | while IFS= read -r f; do
                safe="$(echo "$f" | sed 's#[^/]*/\.xmake/##; s#.*/cache/packages/##; s#/#_#g')"
                cp "$f" "diagnostics/$safe" 2>/dev/null || true
              done
          { echo "=== native-build.log tail ==="; tail -n 120 "${RUNNER_TEMP}/native-build.log" 2>/dev/null || true;
            for f in diagnostics/*; do
              case "$f" in *summary.txt) continue;; esac
              echo; echo "=== $f ==="; tail -n 120 "$f" 2>/dev/null || true;
            done; } > diagnostics/summary.txt
          ls -l diagnostics || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics
          git -c core.autocrlf=false commit -m "ci: diagnostics for run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:ios15 || true
          true

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios15-diagnostics
          path: diagnostics
          if-no-files-found: ignore
